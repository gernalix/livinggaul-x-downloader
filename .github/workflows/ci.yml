name: CI

on:
  push:
    branches: [master, task/P109-catalog]
    paths-ignore:
      - '**/*.md'
      - 'reports/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'reports/**'

permissions:
  contents: read

concurrency:
  group: livinggaul-x-downloader-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'task/wi-f4014d28c049406a8777472f0e44622f') && 'purify-local-1272741951' || (((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'task/P109-catalog') || (github.event_name == 'push' && github.ref == 'refs/heads/task/P109-catalog')) && 'p113-69-livinggaul-x' || 'ubuntu-latest') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Telegram dependencies
        run: python -m pip install -r requirements-video-downloader.txt
      - name: Compile downloader
        run: python -m py_compile livinggaul-x-downloader telegram_video_downloader.py video_downloader
      - name: CLI smoke test
        run: python livinggaul-x-downloader --help >/dev/null
      - name: Systemd installer syntax
        run: bash -n systemd/install-user-service.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
